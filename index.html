<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game 🐍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 20px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            font-size: 32px;
        }

        .score-board {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 20px;
            width: 100%;
            flex-wrap: wrap;
        }

        .score-item {
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            min-width: 120px;
        }

        .score-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 24px;
        }

        #gameBoard {
            width: 100%;
            aspect-ratio: 1;
            max-width: 400px;
            background-color: #1a1a1a;
            border: 3px solid #667eea;
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            grid-template-rows: repeat(20, 1fr);
            gap: 0;
            margin: 20px 0;
            border-radius: 10px;
            overflow: hidden;
        }

        .cell {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            border: 0.5px solid #333;
        }

        .snake {
            background-color: #4caf50;
            border-radius: 2px;
        }

        .snake.head {
            background-color: #45a049;
            box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.5);
        }

        .food {
            background-color: #ff5722;
            border-radius: 50%;
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.8); }
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .direction-buttons {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(3, 70px);
            gap: 8px;
            margin: 20px 0;
            justify-content: center;
        }

        .dir-btn {
            padding: 0;
            font-size: 24px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .dir-btn:hover {
            transform: scale(1.1);
        }

        .dir-btn:active {
            transform: scale(0.95);
        }

        .dir-btn.up { grid-column: 2; grid-row: 1; }
        .dir-btn.left { grid-column: 1; grid-row: 2; }
        .dir-btn.down { grid-column: 2; grid-row: 3; }
        .dir-btn.right { grid-column: 3; grid-row: 2; }

        .game-status {
            text-align: center;
            font-size: 18px;
            color: #333;
            min-height: 30px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .game-status.playing {
            color: #4caf52;
        }

        .game-status.game-over {
            color: #ff5722;
        }

        .info {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .game-container {
                padding: 20px;
                border-radius: 10px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 15px;
            }

            .score-board {
                gap: 15px;
                margin-bottom: 15px;
            }

            .score-item {
                padding: 12px 18px;
                min-width: 100px;
            }

            .score-label {
                font-size: 11px;
            }

            .score-value {
                font-size: 20px;
            }

            button {
                padding: 10px 18px;
                font-size: 14px;
            }

            .direction-buttons {
                grid-template-columns: repeat(3, 60px);
                grid-template-rows: repeat(3, 60px);
                gap: 6px;
                margin: 15px 0;
            }

            .dir-btn {
                font-size: 20px;
            }

            .info {
                font-size: 12px;
            }
        }

        @media (max-width: 400px) {
            .game-container {
                padding: 15px;
            }

            h1 {
                font-size: 20px;
                margin-bottom: 12px;
            }

            .score-board {
                gap: 10px;
            }

            .score-item {
                padding: 10px 15px;
                font-size: 12px;
            }

            .score-value {
                font-size: 18px;
            }

            button {
                padding: 8px 14px;
                font-size: 12px;
            }

            .direction-buttons {
                grid-template-columns: repeat(3, 50px);
                grid-template-rows: repeat(3, 50px);
                gap: 5px;
            }

            .dir-btn {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 SNAKE GAME</h1>

        <div class="score-board">
            <div class="score-item">
                <div class="score-label">Score</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">High Score</div>
                <div class="score-value" id="highScore">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Level</div>
                <div class="score-value" id="level">1</div>
            </div>
        </div>

        <div class="game-status" id="gameStatus">Ready to Play!</div>

        <div id="gameBoard"></div>

        <div class="controls">
            <button id="startBtn" onclick="startGame()">START GAME</button>
            <button id="pauseBtn" onclick="togglePause()" style="display:none;">PAUSE</button>
            <button onclick="resetGame()">RESET</button>
        </div>

        <div class="direction-buttons">
            <button class="dir-btn up" onclick="changeDirection('UP')">⬆</button>
            <button class="dir-btn left" onclick="changeDirection('LEFT')">⬅</button>
            <button class="dir-btn down" onclick="changeDirection('DOWN')">⬇</button>
            <button class="dir-btn right" onclick="changeDirection('RIGHT')">➡</button>
        </div>

        <div class="info">
            Use arrow keys or buttons to control the snake. Eat food 🍎 to grow!
        </div>
    </div>

    <script>
        const BOARD_SIZE = 20;
        const CELL_COUNT = BOARD_SIZE * BOARD_SIZE;
        let gameBoard = document.getElementById('gameBoard');
        let scoreDisplay = document.getElementById('score');
        let highScoreDisplay = document.getElementById('highScore');
        let levelDisplay = document.getElementById('level');
        let gameStatusDisplay = document.getElementById('gameStatus');

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let direction = 'RIGHT';
        let nextDirection = 'RIGHT';
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let level = 1;
        let gameRunning = false;
        let gamePaused = false;
        let gameSpeed = 100;
        let gameLoop;

        highScoreDisplay.textContent = highScore;

        function initializeBoard() {
            gameBoard.innerHTML = '';
            for (let i = 0; i < CELL_COUNT; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${i}`;
                gameBoard.appendChild(cell);
            }
        }

        function positionToIndex(x, y) {
            return y * BOARD_SIZE + x;
        }

        function draw() {
            // Clear board
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.className = 'cell';
            });

            // Draw snake
            snake.forEach((segment, index) => {
                const index_pos = positionToIndex(segment.x, segment.y);
                const cell = document.getElementById(`cell-${index_pos}`);
                if (cell) {
                    if (index === 0) {
                        cell.className = 'cell snake head';
                    } else {
                        cell.className = 'cell snake';
                    }
                }
            });

            // Draw food
            const foodIndex = positionToIndex(food.x, food.y);
            const foodCell = document.getElementById(`cell-${foodIndex}`);
            if (foodCell) {
                foodCell.className = 'cell food';
            }
        }

        function update() {
            if (!gameRunning || gamePaused) return;

            direction = nextDirection;

            // Calculate new head
            let newHead = { ...snake[0] };
            switch (direction) {
                case 'UP':
                    newHead.y = (newHead.y - 1 + BOARD_SIZE) % BOARD_SIZE;
                    break;
                case 'DOWN':
                    newHead.y = (newHead.y + 1) % BOARD_SIZE;
                    break;
                case 'LEFT':
                    newHead.x = (newHead.x - 1 + BOARD_SIZE) % BOARD_SIZE;
                    break;
                case 'RIGHT':
                    newHead.x = (newHead.x + 1) % BOARD_SIZE;
                    break;
            }

            // Check collision with self
            if (snake.some(segment => segment.x === newHead.x && segment.y === newHead.y)) {
                endGame();
                return;
            }

            snake.unshift(newHead);

            // Check if food is eaten
            if (newHead.x === food.x && newHead.y === food.y) {
                score += 10 * level;
                scoreDisplay.textContent = score;

                // Update high score
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHighScore', highScore);
                    highScoreDisplay.textContent = highScore;
                }

                // Generate new food
                generateFood();

                // Increase level every 5 foods
                if (score % 50 === 0) {
                    level++;
                    levelDisplay.textContent = level;
                    gameSpeed = Math.max(30, 100 - (level - 1) * 10);
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, gameSpeed);
                }
            } else {
                snake.pop();
            }

            draw();
        }

        function generateFood() {
            let newFood;
            let valid = false;
            while (!valid) {
                newFood = {
                    x: Math.floor(Math.random() * BOARD_SIZE),
                    y: Math.floor(Math.random() * BOARD_SIZE)
                };
                valid = !snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
            }
            food = newFood;
        }

        function changeDirection(newDirection) {
            const opposites = {
                'UP': 'DOWN',
                'DOWN': 'UP',
                'LEFT': 'RIGHT',
                'RIGHT': 'LEFT'
            };

            if (opposites[newDirection] !== direction) {
                nextDirection = newDirection;
            }
        }

        function startGame() {
            if (!gameRunning) {
                gameRunning = true;
                gamePaused = false;
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('pauseBtn').style.display = 'block';
                gameStatusDisplay.textContent = '▶ Playing...';
                gameStatusDisplay.className = 'game-status playing';
                gameLoop = setInterval(update, gameSpeed);
            }
        }

        function togglePause() {
            gamePaused = !gamePaused;
            document.getElementById('pauseBtn').textContent = gamePaused ? 'RESUME' : 'PAUSE';
            gameStatusDisplay.textContent = gamePaused ? '⏸ Paused' : '▶ Playing...';
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('pauseBtn').style.display = 'none';
            document.getElementById('pauseBtn').textContent = 'PAUSE';
            gameStatusDisplay.textContent = '💀 Game Over! Score: ' + score;
            gameStatusDisplay.className = 'game-status game-over';
        }

        function resetGame() {
            gameRunning = false;
            gamePaused = false;
            clearInterval(gameLoop);
            snake = [{ x: 10, y: 10 }];
            food = { x: 15, y: 15 };
            direction = 'RIGHT';
            nextDirection = 'RIGHT';
            score = 0;
            level = 1;
            gameSpeed = 100;
            scoreDisplay.textContent = '0';
            levelDisplay.textContent = '1';
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('pauseBtn').style.display = 'none';
            document.getElementById('pauseBtn').textContent = 'PAUSE';
            gameStatusDisplay.textContent = 'Ready to Play!';
            gameStatusDisplay.className = 'game-status';
            draw();
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    changeDirection('UP');
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    changeDirection('DOWN');
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    changeDirection('LEFT');
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    changeDirection('RIGHT');
                    break;
                case ' ':
                    e.preventDefault();
                    if (gameRunning) togglePause();
                    break;
            }
        });

        // Initialize
        initializeBoard();
        draw();
    </script>
</body>
</html>
